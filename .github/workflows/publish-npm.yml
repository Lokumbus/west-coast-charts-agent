name: Publish prepacked npm release

on:
  push:
    tags:
      - v0.2.3

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: npm-publication
      url: https://www.npmjs.com/package/west-coast-charts-agent
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Verify pinned release archive
        run: node scripts/verify-agent-release-archive.mjs
      - name: Preserve verified release archive
        uses: actions/upload-artifact@v4
        with:
          name: west-coast-charts-agent-0.2.3-prepacked-release
          path: |
            releases/west-coast-charts-agent-0.2.3.tgz
            releases/west-coast-charts-agent-0.2.3.json
          if-no-files-found: error
          retention-days: 90
      - name: Publish exact verified archive with provenance
        run: npm publish releases/west-coast-charts-agent-0.2.3.tgz --provenance --access public --ignore-scripts
